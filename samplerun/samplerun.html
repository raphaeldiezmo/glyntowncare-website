<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        section {
            height: 100vh;
            font-size: 7rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-to-top {
            animation: bottom2top forwards;
            animation-timeline: view();
            animation-range: entry 0% cover 40%;
        }



        @keyframes bottom2top {
            from {
                opacity: 0;
                transform: translateX(200px);
                scale: 1.4;
            }

            to {
                opacity: 1;
                transform: translateX(0);
                scale: 1;
            }

        }
    </style>
</head>

<body>
    <section>
        <span class="filler-content">1</span>
    </section>
    <section>
        <span class="filler-content bottom-to-top">2</span>
    </section>

    <section>
        <span class="filler-content">3</span>
    </section>

</body>


</html>
